[[outputs.influxdb_v2]]
  urls         = ["${INFLUX_URL}"]
  token        = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket       = "${INFLUX_BUCKET}"
  timeout      = "10s"

[global_tags]
  host = "dsk-1-debian"
  role = "compute-node"

[agent]
  hostname         = "dsk-1-debian"
  omit_hostname    = false
  interval         = "10s"
  round_interval   = true
  flush_interval   = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  logfile          = ""

[[inputs.cpu]]
  percpu        = true
  totalcpu      = true
  report_active = true

[[inputs.mem]]
[[inputs.swap]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs", "nsfs"]

[[inputs.diskio]]
[[inputs.processes]]
[[inputs.system]]
[[inputs.kernel]]

[[inputs.net]]
  ignore_protocol_stats = true

[[inputs.nstat]]
  proc_net_netstat = "/proc/net/netstat"
  proc_net_snmp    = "/proc/net/snmp"
  proc_net_snmp6   = "/proc/net/snmp6"

[[inputs.filecount]]
  directories = ["/hostfs/var/log"]
  name = "varlog_count"
  recursive = true

[[inputs.docker]]
  endpoint = "tcp://desktop-1-docker-proxy:2375"
